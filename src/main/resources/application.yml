spring:
  application:
    name: gnews-mock-api

  datasource:
    url: jdbc:h2:mem:gnewsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

server:
  port: 8080

gnews:
  api-key: ${GNEWS_API_KEY:test-api-key}
  rate-limit:
    daily-requests: 100
